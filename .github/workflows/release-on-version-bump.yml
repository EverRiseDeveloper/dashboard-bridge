name: Publish a release on version bump

# HACS's update detection is built around actual GitHub Releases, not just
# a bumped manifest.json commit — see the incident that motivated this
# workflow originally: 0.3.1 and 0.4.0 were pushed to main with the
# manifest bumped, but HACS kept reporting 0.3.0 as the latest available
# version for every client, because no Release ever existed for anything
# past 0.3.0. This closes that gap: every push to main that changes
# manifest.json's version automatically gets a matching GitHub Release —
# which is also what the EverRise dashboard's own Updates screen reads to
# show a customer what a pending update contains.
#
# Release notes come from RELEASE_NOTES.md at the repo root, NOT GitHub's
# auto-generated commit list. Raw commit messages in this repo aren't
# customer-facing copy (things like "Added last time check" mean nothing to
# someone deciding whether to install an update on their house) — so write
# RELEASE_NOTES.md for the next release before/with the version bump, in
# the same commit or PR. This workflow refuses to publish if that file
# still matches the previous release's notes, so a forgotten update fails
# the build instead of silently shipping the wrong description under a new
# version number.
on:
  push:
    branches: [main]
    paths:
      - custom_components/everrise_dashboard/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/everrise_dashboard/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        # Not every push to main that touches manifest.json actually changes
        # the version (a formatting fix, a merge, etc.) — and gh release
        # create would fail outright on a duplicate tag anyway, so check
        # first and skip cleanly instead of failing the workflow.
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Version ${{ steps.version.outputs.version }} already has a release — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require RELEASE_NOTES.md
        if: steps.check.outputs.exists == 'false'
        run: |
          if [ ! -f RELEASE_NOTES.md ] || [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is missing or empty. Write what changed in this version — for the customer reading it on the Updates screen, not for another developer — before bumping manifest.json's version."
            exit 1
          fi

      - name: Refuse stale release notes
        # Compares RELEASE_NOTES.md's current content against the most
        # recently published release's body, byte-for-byte (via diff, not
        # a shell-parsed comparison — release notes are arbitrary customer
        # text and WILL contain apostrophes/quotes). Identical means this
        # version bump almost certainly forgot to update the notes —
        # publishing anyway would show a customer the PREVIOUS release's
        # description under the NEW version number. Fail loudly instead.
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName // empty')
          if [ -n "$LATEST_TAG" ]; then
            gh release view "$LATEST_TAG" --repo "${{ github.repository }}" --json body -q .body > /tmp/previous_notes.txt
            if diff -q --ignore-trailing-space /tmp/previous_notes.txt RELEASE_NOTES.md >/dev/null; then
              echo "::error::RELEASE_NOTES.md still matches $LATEST_TAG's published notes. Update it to describe what changed in ${{ steps.version.outputs.version }} before bumping the version."
              exit 1
            fi
          fi

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target main \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
